# demolab config — every key is optional, but keep the file: it marks the project root.
name: Demolab
book-title: Demolab — the book
contents-title: Demolab — contents
# One-line tagline shown under the title on the homepage.
description: A Typst presentation published as a website with optional PDFs.
# The lab's owner — shown as a byline under the homepage title and as <meta name="author">.
# Contact is optional; if set, the byline links to it.
# author: Your Name
# contact: you@example.com

# PDF publishing is enabled by default. Disable it for a web-only lab; existing PDFs are
# left untouched, and PDF-only slide decks are omitted from the site.
# pdfs: false

# Optional collaborative inline comments on web pages. Readers select text
# and discuss it through Hypothesis accounts and groups; PDFs are unchanged. Set this lab-wide,
# or omit it here and add `annotations: "hypothesis"` to selected writings' `meta` blocks.
# annotations: hypothesis

# Keep the compact collection directory by default. To show recent authored work followed by
# expanded collection contents, enable this mode. Omit `recent` or set it to 0 to hide that section.
# index:
#   mode: expanded
#   recent: 5

# Optional custom landing page — not a config key: create a `landing.typ` at the repo root
# exporting `#let body = [...]` and the homepage renders it (web only) instead of the collection
# directory, below the title/tagline/byline above. Delete the file to get the directory back.

# Homepage collections. Writings are grouped by their `collection:` meta field; this
# registry gives each collection a display label + description and sets the order. A
# collection with no entry here still works — its slug is just title-cased. Add
# `theme: docs` to a collection whose articles should have a light developer-documentation
# web treatment. Collection listings and PDFs retain the standard design.
collection-order: [notes, slides]
collections:
  notes:
    label: Notes
    description: The presentation's main writings.
  slides:
    label: Talks & slides
    description: Deck PDFs from talks — paged-only, linked as PDF.
