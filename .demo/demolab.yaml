# Internal demo content; generated runtime stays in the repository's .demolab/.
name: Example Site
preview:
  source: data
  discover: [python, scripts/discover_runs.py]
  articles:
    # Explicit so the single-input demo also has a selector before its first run.
    benchmark-a: [benchmark-a]
    benchmark-empty: [benchmark-empty]
    benchmark-gallery: [benchmark-a, benchmark-b]
    benchmark-comparison:
      baseline: [benchmark-a, benchmark-b]
      candidate: [benchmark-a, benchmark-b]
book-title: Example Site — collected pages
contents-title: Example Site — contents
description: A tiny Demolab site with ordinary pages, four data-source demos, and developer documentation.
links:
  - label: Developer docs
    url: documentation
  - label: Source
    url: https://github.com/eoinmurray/demolab

index:
  mode: expanded
  recent: 3

collection-order: [pages, data-source-demos, documentation]
collections:
  pages:
    label: Example pages
    description: "Enough content to demonstrate navigation, writing metadata, and assets."
  data-source-demos:
    label: Data-source demos
    description: "Single-run presentation, multi-input gallery, and paired comparisons with local run selectors."
  documentation:
    label: Documentation
    description: "Developer documentation grouped by project."
    theme: docs
    homepage: false
    children: [pinglab-docs, snnlang-docs, snnsim-docs, snnviz-docs]
  pinglab-docs:
    label: Pinglab docs
    description: "Developer guides and API notes for Pinglab."
  snnlang-docs:
    label: SNNLANG docs
    description: "Language reference and integration guides for SNNLANG."
  snnsim-docs:
    label: SNNSIM docs
    description: "Simulation APIs and runtime documentation for SNNSIM."
  snnviz-docs:
    label: SNNVIZ docs
    description: "Visualisation components and usage guides for SNNVIZ."
